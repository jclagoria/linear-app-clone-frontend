events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version for security
    server_tokens off;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # -------------------------------------------------------------------
        # Security headers for all responses
        # -------------------------------------------------------------------
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'";

        # -------------------------------------------------------------------
        # SPA fallback: serve index.html for all non-file routes
        # -------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -------------------------------------------------------------------
        # Static assets with long-term caching (cache-busted filenames)
        # -------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # -------------------------------------------------------------------
        # Deny access to hidden files (.env, .git, etc.)
        # -------------------------------------------------------------------
        location ~ /\. {
            deny all;
            return 403;
        }
    }
}
