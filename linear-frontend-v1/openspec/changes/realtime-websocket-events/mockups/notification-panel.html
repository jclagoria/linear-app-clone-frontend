<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Panel — Mockup</title>
  <style>
    :root {
      --color-primary: #5E6AD2;
      --color-surface: #F7F8FC;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E6E8EC;
      --color-text-primary: #1A1D26;
      --color-text-secondary: #6B7280;
      --color-success: #2DA44E;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --radius-md: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-surface); color: var(--color-text-primary); }
    .header { display: flex; align-items: center; height: 56px; padding: 0 var(--space-6); background: var(--color-surface-elevated); border-bottom: 1px solid var(--color-border); }
    .header-logo { font-size: 18px; font-weight: 700; color: var(--color-primary); margin-right: var(--space-6); text-decoration: none; }
    .header-nav { display: flex; gap: var(--space-4); margin-right: auto; }
    .header-nav a { font-size: 14px; color: var(--color-text-secondary); text-decoration: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); }
    .header-nav a.active { color: var(--color-text-primary); font-weight: 500; }

    .controls { padding: var(--space-3) var(--space-6); display: flex; gap: var(--space-2); }
    .controls button { padding: 6px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-elevated); cursor: pointer; font-size: 12px; }
    .controls button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    .panel-wrapper { display: flex; justify-content: flex-end; padding: var(--space-6); }
    .notif-panel { width: 400px; background: var(--color-surface-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-height: 500px; display: flex; flex-direction: column; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
    .panel-title { font-size: 14px; font-weight: 600; }
    .panel-action { font-size: 12px; color: var(--color-primary); cursor: pointer; background: none; border: none; }
    .panel-action:hover { text-decoration: underline; }
    .panel-action:disabled { color: var(--color-muted); cursor: default; text-decoration: none; }
    .notif-list { overflow-y: auto; flex: 1; }
    .notif-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); cursor: pointer; transition: background 0.1s; }
    .notif-item:hover { background: var(--color-surface); }
    .notif-item:last-child { border-bottom: none; }
    .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary); flex-shrink: 0; margin-top: 6px; }
    .notif-dot.read { background: transparent; }
    .notif-icon { font-size: 18px; flex-shrink: 0; }
    .notif-content { flex: 1; min-width: 0; }
    .notif-text { font-size: 13px; line-height: 1.4; }
    .notif-text strong { font-weight: 600; }
    .notif-time { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
    .notif-empty { text-align: center; padding: 48px 24px; color: var(--color-text-secondary); }
    .notif-empty h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--color-text-primary); }
    .notif-error { text-align: center; padding: 48px 24px; color: var(--color-danger); }
    .skeleton { background: #E5E7EB; border-radius: 4px; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="header-logo">Linear</a>
    <nav class="header-nav">
      <a href="issue-list.html">Issues</a>
      <a href="project-list.html">Projects</a>
      <a href="cycle-list.html">Cycles</a>
    </nav>
  </header>

  <div class="controls">
    <span style="font-size:12px;color:var(--color-text-secondary);margin-right:8px;">State:</span>
    <button class="active" onclick="setState('populated')">Populated</button>
    <button onclick="setState('empty')">Empty</button>
    <button onclick="setState('loading')">Loading</button>
    <button onclick="setState('error')">Error</button>
    <button onclick="setState('read')">All Read</button>
  </div>

  <div class="panel-wrapper">
    <div id="panel" class="notif-panel" role="region" aria-label="Notifications">
      <div class="panel-header">
        <span class="panel-title">Notifications</span>
        <button class="panel-action" id="markAllBtn" onclick="markAllRead()">Mark All Read</button>
      </div>
      <div id="notifList" class="notif-list"></div>
    </div>
  </div>

  <script>
    const notifications = [
      { unread: true, icon: '💬', text: '<strong>John</strong> commented on <strong>"Fix login timeout"</strong>', time: '2m ago' },
      { unread: true, icon: '✏️', text: '<strong>Sarah</strong> updated project <strong>"Frontend Redesign"</strong>', time: '5m ago' },
      { unread: true, icon: '✅', text: '<strong>Mike</strong> completed cycle <strong>"Sprint 13"</strong>', time: '1h ago' },
      { unread: false, icon: '👤', text: '<strong>Emily</strong> assigned you to <strong>"API refactor"</strong>', time: '3h ago' },
      { unread: false, icon: '🔗', text: '<strong>Alex</strong> linked PR #421 to <strong>"Fix login timeout"</strong>', time: 'Yesterday' },
    ];

    function renderNotifs(list) {
      document.getElementById('notifList').innerHTML = list.map(n => `
        <div class="notif-item" role="article" aria-label="${n.text.replace(/<[^>]+>/g, '')}">
          <div class="notif-dot ${n.unread ? '' : 'read'}"></div>
          <span class="notif-icon">${n.icon}</span>
          <div class="notif-content">
            <div class="notif-text">${n.text}</div>
            <div class="notif-time">${n.time}</div>
          </div>
        </div>
      `).join('');
    }

    function renderSkeletons() {
      document.getElementById('notifList').innerHTML = Array(3).fill('').map(() => `
        <div class="notif-item"><div class="skeleton" style="width:8px;height:8px;border-radius:50%;margin-top:6px;"></div><div class="skeleton" style="width:24px;height:24px;border-radius:4px;"></div><div style="flex:1;"><div class="skeleton" style="width:80%;height:12px;margin-bottom:4px;"></div><div class="skeleton" style="width:40%;height:10px;"></div></div></div>
      `).join('');
    }

    function renderEmpty() {
      document.getElementById('notifList').innerHTML = `<div class="notif-empty"><div style="font-size:36px;margin-bottom:12px;">🔔</div><h3>No notifications</h3><p>You're all caught up!</p></div>`;
    }

    function renderError() {
      document.getElementById('notifList').innerHTML = `<div class="notif-error"><div style="font-size:36px;margin-bottom:12px;">⚠️</div><h3 style="color:var(--color-text-primary);">Failed to load notifications</h3><p><button class="panel-action" style="font-size:13px;">Retry</button></p></div>`;
    }

    function renderRead() {
      renderNotifs(notifications.map(n => ({...n, unread: false})));
    }

    function setState(state) {
      document.querySelectorAll('.controls button').forEach((b, i) => {
        if (i < 5) {
          const labels = ['populated','empty','loading','error','read'];
          b.classList.toggle('active', labels[i] === state);
        }
      });
      if (state === 'populated') renderNotifs(notifications);
      else if (state === 'empty') renderEmpty();
      else if (state === 'loading') renderSkeletons();
      else if (state === 'error') renderError();
      else if (state === 'read') renderRead();
    }

    function markAllRead() {
      renderNotifs(notifications.map(n => ({...n, unread: false})));
    }

    renderNotifs(notifications);
  </script>
</body>
</html>
