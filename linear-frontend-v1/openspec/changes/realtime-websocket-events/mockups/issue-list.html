<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue List — Mockup</title>
  <style>
    :root {
      --color-primary: #5E6AD2;
      --color-surface: #F7F8FC;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E6E8EC;
      --color-text-primary: #1A1D26;
      --color-text-secondary: #6B7280;
      --color-success: #2DA44E;
      --color-warning: #E3B341;
      --color-danger: #CF222E;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --radius-md: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-surface); color: var(--color-text-primary); }
    .header { display: flex; align-items: center; height: 56px; padding: 0 var(--space-6); background: var(--color-surface-elevated); border-bottom: 1px solid var(--color-border); }
    .header-logo { font-size: 18px; font-weight: 700; color: var(--color-primary); margin-right: var(--space-6); text-decoration: none; }
    .header-nav { display: flex; gap: var(--space-4); margin-right: auto; }
    .header-nav a { font-size: 14px; color: var(--color-text-secondary); text-decoration: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); }
    .header-nav a.active { color: var(--color-text-primary); font-weight: 500; }
    .conn-indicator { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: 12px; margin-right: var(--space-4); }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-success); }

    .toolbar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); background: var(--color-surface-elevated); }
    .toolbar input { padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; width: 200px; outline: none; }
    .toolbar input:focus { border-color: var(--color-primary); }
    .toolbar select { padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; background: #fff; }
    .toolbar .spacer { flex: 1; }
    .btn-primary { padding: var(--space-2) var(--space-4); background: var(--color-primary); color: #fff; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-primary:hover { opacity: 0.9; }

    .issue-list { max-width: 900px; margin: 0 auto; }
    .issue-card { display: flex; align-items: center; padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); background: var(--color-surface-elevated); cursor: pointer; transition: background 0.1s; gap: var(--space-3); }
    .issue-card:hover { background: #F0F1F5; }
    .issue-status { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .status-todo { border: 2px solid var(--color-muted); }
    .status-progress { border: 2px solid var(--color-warning); background: var(--color-warning); }
    .status-done { background: var(--color-primary); }
    .issue-info { flex: 1; min-width: 0; }
    .issue-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .issue-meta { display: flex; gap: var(--space-2); margin-top: 4px; font-size: 12px; color: var(--color-text-secondary); }
    .issue-meta .label { padding: 1px 6px; border-radius: 4px; font-size: 11px; }
    .label-bug { background: #FEE2E2; color: #B91C1C; }
    .label-feat { background: #DBEAFE; color: #1D4ED8; }
    .issue-priority { font-size: 12px; }
    .issue-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .issue-comments { font-size: 12px; color: var(--color-text-secondary); }
    .issue-actions { opacity: 0; transition: opacity 0.1s; }
    .issue-card:hover .issue-actions { opacity: 1; }
    .issue-actions button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px; }

    .empty-state, .error-state { text-align: center; padding: 80px 24px; color: var(--color-text-secondary); }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--color-text-primary); }
    .empty-state p, .error-state p { font-size: 14px; margin-bottom: 16px; }
    .error-state { color: var(--color-danger); }

    .skeleton-card { display: flex; align-items: center; padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); background: var(--color-surface-elevated); gap: var(--space-3); }
    .skeleton { background: #E5E7EB; border-radius: 4px; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .controls { padding: var(--space-3) var(--space-6); display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .controls button { padding: 6px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-elevated); cursor: pointer; font-size: 12px; }
    .controls button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    .highlight { animation: highlightFade 1.5s ease-out; }
    @keyframes highlightFade { 0% { background: #DBEAFE; } 100% { background: var(--color-surface-elevated); } }
  </style>
</head>
<body>
  <header class="header" role="banner">
    <a href="index.html" class="header-logo">Linear</a>
    <nav class="header-nav">
      <a href="issue-list.html" class="active">Issues</a>
      <a href="project-list.html">Projects</a>
      <a href="cycle-list.html">Cycles</a>
    </nav>
    <div class="conn-indicator" role="status"><span class="conn-dot"></span><span>Connected</span></div>
  </header>

  <div class="controls">
    <span style="font-size:12px;color:var(--color-text-secondary);margin-right:8px;">State:</span>
    <button class="active" onclick="setState('populated')">Populated</button>
    <button onclick="setState('loading')">Loading</button>
    <button onclick="setState('empty')">Empty</button>
    <button onclick="setState('error')">Error</button>
    <button onclick="simulateEvent()">Simulate Real-time Event</button>
  </div>

  <div id="toolbar" class="toolbar">
    <input type="text" placeholder="Search issues..." aria-label="Search issues" />
    <select aria-label="Filter by status"><option>Status</option><option>Todo</option><option>In Progress</option><option>Done</option></select>
    <select aria-label="Filter by assignee"><option>Assignee</option><option>Sarah Chen</option><option>Mike Johnson</option></select>
    <select aria-label="Filter by priority"><option>Priority</option><option>Urgent</option><option>High</option><option>Medium</option><option>Low</option></select>
    <span class="spacer"></span>
    <button class="btn-primary">+ New Issue</button>
  </div>

  <div id="content" class="issue-list"></div>

  <script>
    const issues = [
      { id: 1, title: 'Fix login timeout issue', status: 'todo', statusLabel: 'Todo', priority: '🔴 Urgent', label: 'Bug', labelCls: 'label-bug', assignee: 'S', assigneeName: 'Sarah Chen', comments: 3, attachments: 1 },
      { id: 2, title: 'Update dashboard design', status: 'progress', statusLabel: 'In Progress', priority: '🔵 Medium', label: 'Feature', labelCls: 'label-feat', assignee: 'M', assigneeName: 'Mike Johnson', comments: 1, attachments: 0 },
      { id: 3, title: 'Add dark mode support', status: 'todo', statusLabel: 'Todo', priority: '🟡 High', label: 'Feature', labelCls: 'label-feat', assignee: 'E', assigneeName: 'Emily Park', comments: 0, attachments: 2 },
      { id: 4, title: 'Refactor auth module', status: 'done', statusLabel: 'Done', priority: '⚪ Low', label: 'Bug', labelCls: 'label-bug', assignee: 'A', assigneeName: 'Alex Rivera', comments: 5, attachments: 0 },
      { id: 5, title: 'Improve search performance', status: 'progress', statusLabel: 'In Progress', priority: '🟡 High', label: 'Feature', labelCls: 'label-feat', assignee: 'S', assigneeName: 'Sarah Chen', comments: 2, attachments: 0 },
    ];

    function renderIssues(list) {
      const el = document.getElementById('content');
      el.innerHTML = list.map(i => `
        <a href="issue-detail.html" class="issue-card" style="text-decoration:none;color:inherit;">
          <div class="issue-status status-${i.status}"></div>
          <div class="issue-info">
            <div class="issue-title">${i.title}</div>
            <div class="issue-meta">
              <span class="label ${i.labelCls}">${i.label}</span>
              <span class="issue-priority">${i.priority}</span>
              <span class="issue-comments">💬${i.comments}</span>
              ${i.attachments ? `<span>📎${i.attachments}</span>` : ''}
            </div>
          </div>
          <div class="issue-avatar" title="${i.assigneeName}">${i.assignee}</div>
          <div class="issue-actions"><button aria-label="Actions">🔧</button></div>
        </a>
      `).join('');
    }

    function renderSkeletons() {
      const el = document.getElementById('content');
      el.innerHTML = Array(4).fill('').map(() => `
        <div class="skeleton-card">
          <div class="skeleton" style="width:12px;height:12px;border-radius:50%;"></div>
          <div style="flex:1;">
            <div class="skeleton" style="width:60%;height:14px;margin-bottom:6px;"></div>
            <div class="skeleton" style="width:40%;height:12px;"></div>
          </div>
          <div class="skeleton" style="width:24px;height:24px;border-radius:50%;"></div>
        </div>
      `).join('');
    }

    function renderEmpty() {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div style="font-size:48px;margin-bottom:16px;">📋</div>
          <h3>No issues yet</h3>
          <p>Create your first issue to get started.</p>
          <button class="btn-primary" style="padding:10px 20px;">+ Create Issue</button>
        </div>`;
    }

    function renderError() {
      document.getElementById('content').innerHTML = `
        <div class="error-state">
          <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
          <h3 style="color:var(--color-text-primary);">Failed to load issues</h3>
          <p style="color:var(--color-text-secondary);">Please check your connection and try again.</p>
          <button class="btn-primary" style="padding:10px 20px;">Retry</button>
        </div>`;
    }

    function setState(state) {
      document.querySelectorAll('.controls button').forEach((b, i) => {
        if (i < 4) b.classList.toggle('active', b.textContent.toLowerCase() === state);
      });
      if (state === 'populated') renderIssues(issues);
      else if (state === 'loading') renderSkeletons();
      else if (state === 'empty') renderEmpty();
      else if (state === 'error') renderError();
    }

    function simulateEvent() {
      const el = document.getElementById('content');
      const firstCard = el.querySelector('.issue-card');
      if (firstCard) {
        firstCard.classList.add('highlight');
        const title = firstCard.querySelector('.issue-title');
        if (title) title.textContent = title.textContent + ' (updated)';
        setTimeout(() => firstCard.classList.remove('highlight'), 1500);
      }
    }

    renderIssues(issues);
  </script>
</body>
</html>
