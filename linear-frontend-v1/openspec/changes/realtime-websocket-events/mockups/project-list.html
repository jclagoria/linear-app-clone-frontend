<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project List — Mockup</title>
  <style>
    :root {
      --color-primary: #5E6AD2;
      --color-surface: #F7F8FC;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E6E8EC;
      --color-text-primary: #1A1D26;
      --color-text-secondary: #6B7280;
      --color-success: #2DA44E;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --radius-md: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-surface); color: var(--color-text-primary); }
    .header { display: flex; align-items: center; height: 56px; padding: 0 var(--space-6); background: var(--color-surface-elevated); border-bottom: 1px solid var(--color-border); }
    .header-logo { font-size: 18px; font-weight: 700; color: var(--color-primary); margin-right: var(--space-6); text-decoration: none; }
    .header-nav { display: flex; gap: var(--space-4); margin-right: auto; }
    .header-nav a { font-size: 14px; color: var(--color-text-secondary); text-decoration: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); }
    .header-nav a.active { color: var(--color-text-primary); font-weight: 500; }
    .conn-indicator { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: 12px; margin-right: var(--space-4); }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-success); }

    .toolbar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); background: var(--color-surface-elevated); }
    .toolbar input { padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; width: 200px; }
    .toolbar .spacer { flex: 1; }
    .btn-primary { padding: var(--space-2) var(--space-4); background: var(--color-primary); color: #fff; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }

    .controls { padding: var(--space-3) var(--space-6); display: flex; gap: var(--space-2); }
    .controls button { padding: 6px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-elevated); cursor: pointer; font-size: 12px; }
    .controls button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    .project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); padding: var(--space-6); max-width: 1100px; margin: 0 auto; }
    .project-card { background: var(--color-surface-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); cursor: pointer; transition: box-shadow 0.15s; }
    .project-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .project-icon { font-size: 20px; margin-bottom: var(--space-2); }
    .project-name { font-size: 16px; font-weight: 600; margin-bottom: var(--space-3); }
    .progress-bar { height: 6px; background: #E5E7EB; border-radius: 3px; overflow: hidden; margin-bottom: var(--space-2); }
    .progress-fill { height: 100%; background: var(--color-primary); border-radius: 3px; transition: width 0.3s; }
    .progress-text { font-size: 12px; color: var(--color-text-secondary); margin-bottom: var(--space-3); }
    .member-avatars { display: flex; }
    .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; margin-left: -6px; border: 2px solid var(--color-surface-elevated); }
    .avatar:first-child { margin-left: 0; }

    .empty-state { text-align: center; padding: 80px 24px; color: var(--color-text-secondary); grid-column: 1 / -1; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--color-text-primary); }

    .highlight { animation: highlightFade 1.5s ease-out; }
    @keyframes highlightFade { 0% { background: #DBEAFE; } 100% { background: var(--color-surface-elevated); } }
    .skeleton { background: #E5E7EB; border-radius: 4px; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="header-logo">Linear</a>
    <nav class="header-nav">
      <a href="issue-list.html">Issues</a>
      <a href="project-list.html" class="active">Projects</a>
      <a href="cycle-list.html">Cycles</a>
    </nav>
    <div class="conn-indicator"><span class="conn-dot"></span><span>Connected</span></div>
  </header>

  <div class="controls">
    <span style="font-size:12px;color:var(--color-text-secondary);margin-right:8px;">State:</span>
    <button class="active" onclick="setState('populated')">Populated</button>
    <button onclick="setState('loading')">Loading</button>
    <button onclick="setState('empty')">Empty</button>
    <button onclick="simulateEvent()">Simulate Update</button>
  </div>

  <div class="toolbar">
    <input type="text" placeholder="Search projects..." aria-label="Search projects" />
    <span class="spacer"></span>
    <button class="btn-primary">+ New Project</button>
  </div>

  <div id="content" class="project-grid"></div>

  <script>
    const projects = [
      { icon: '🚀', name: 'Frontend Redesign', progress: 75, members: ['S','M','E'] },
      { icon: '📊', name: 'Analytics Dashboard', progress: 55, members: ['A','M'] },
      { icon: '🎯', name: 'API Refactor', progress: 30, members: ['S'] },
      { icon: '🔧', name: 'Mobile App', progress: 60, members: ['M','E','S','A'] },
      { icon: '📝', name: 'Documentation Hub', progress: 100, members: ['E'] },
    ];

    function renderProjects(list) {
      const el = document.getElementById('content');
      el.innerHTML = list.map(p => `
        <div class="project-card">
          <div class="project-icon">${p.icon}</div>
          <div class="project-name">${p.name}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%"></div></div>
          <div class="progress-text">${p.progress}% complete</div>
          <div class="member-avatars">${p.members.map(m => `<div class="avatar">${m}</div>`).join('')}</div>
        </div>
      `).join('');
    }

    function renderSkeletons() {
      document.getElementById('content').innerHTML = Array(3).fill('').map(() => `
        <div class="project-card">
          <div class="skeleton" style="width:24px;height:24px;border-radius:4px;margin-bottom:8px;"></div>
          <div class="skeleton" style="width:60%;height:16px;margin-bottom:12px;"></div>
          <div class="skeleton" style="width:100%;height:6px;border-radius:3px;margin-bottom:8px;"></div>
          <div class="skeleton" style="width:40%;height:12px;"></div>
        </div>
      `).join('');
    }

    function renderEmpty() {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div style="font-size:48px;margin-bottom:16px;">📁</div>
          <h3>No projects yet</h3>
          <p>Create your first project to get started.</p>
          <button class="btn-primary" style="padding:10px 20px;">+ Create Project</button>
        </div>`;
    }

    function setState(state) {
      document.querySelectorAll('.controls button').forEach((b, i) => {
        if (i < 3) b.classList.toggle('active', b.textContent.toLowerCase() === state);
      });
      if (state === 'populated') renderProjects(projects);
      else if (state === 'loading') renderSkeletons();
      else if (state === 'empty') renderEmpty();
    }

    function simulateEvent() {
      const cards = document.querySelectorAll('.project-card');
      if (cards[1]) {
        cards[1].classList.add('highlight');
        const fill = cards[1].querySelector('.progress-fill');
        if (fill) fill.style.width = '50%';
        const text = cards[1].querySelector('.progress-text');
        if (text) text.textContent = '50% complete';
        setTimeout(() => cards[1].classList.remove('highlight'), 1500);
      }
    }

    renderProjects(projects);
  </script>
</body>
</html>
