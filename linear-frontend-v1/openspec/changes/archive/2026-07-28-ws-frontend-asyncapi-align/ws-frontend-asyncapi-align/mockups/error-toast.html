<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Error Toast — Mockup</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>

<div class="app-shell">
  <header class="app-header">
    <a href="index.html" class="logo">Linear Clone</a>
    <nav>
      <a href="issue-board.html">Board</a>
      <a href="#">Projects</a>
      <a href="#">Settings</a>
    </nav>
    <div class="header-spacer"></div>
    <div class="connection-status" role="status" aria-label="Connected">
      <span class="status-dot connected"></span>
      <span class="status-label">Connected</span>
    </div>
    <div class="user-menu">
      <div class="avatar">JD</div>
      <span style="font-size:12px; color: var(--color-text-muted);">▼</span>
    </div>
  </header>

  <div class="app-content">
    <div class="main-content">
      <h1 style="font: var(--heading-2); margin-bottom: var(--space-4);">Issues</h1>
      <p style="color: var(--color-text-muted);">Toast notification appears at bottom-right. Auto-dismisses after 5s.</p>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- State Toggle Bar -->
<div class="state-bar">
  <label>Toast State:</label>
  <button class="active" onclick="setToast('rate_limited', this)">Rate Limited</button>
  <button onclick="setToast('invalid_channel', this)">Invalid Channel</button>
  <button onclick="setToast('hidden', this)">Hidden</button>
</div>

<script>
  const toastContainer = document.getElementById('toastContainer');
  let countdownInterval = null;

  const toasts = {
    rate_limited: `
      <div class="toast error" role="alert" aria-live="polite">
        <span class="toast-icon">⚠️</span>
        <div class="toast-body">
          <div class="toast-title">Rate limited</div>
          <div class="toast-message">Retry after 30 seconds</div>
          <div class="toast-progress">
            <div class="toast-progress-bar" id="progressBar" style="width: 100%;"></div>
          </div>
        </div>
        <button class="toast-dismiss" aria-label="Dismiss" onclick="dismissToast()">✕</button>
      </div>`,
    invalid_channel: `
      <div class="toast error" role="alert" aria-live="polite">
        <span class="toast-icon">🚫</span>
        <div class="toast-body">
          <div class="toast-title">Invalid channel</div>
          <div class="toast-message">Subscription failed</div>
          <div class="toast-progress">
            <div class="toast-progress-bar" id="progressBar" style="width: 100%;"></div>
          </div>
        </div>
        <button class="toast-dismiss" aria-label="Dismiss" onclick="dismissToast()">✕</button>
      </div>`,
    hidden: ''
  };

  function setToast(type, btn) {
    if (countdownInterval) clearInterval(countdownInterval);
    toastContainer.innerHTML = toasts[type];

    document.querySelectorAll('.state-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (type !== 'hidden') {
      startCountdown();
    }
  }

  function startCountdown() {
    let width = 100;
    const bar = document.getElementById('progressBar');
    if (!bar) return;
    countdownInterval = setInterval(() => {
      width -= 2;
      bar.style.width = width + '%';
      if (width <= 0) {
        clearInterval(countdownInterval);
        toastContainer.innerHTML = '';
      }
    }, 100);
  }

  function dismissToast() {
    if (countdownInterval) clearInterval(countdownInterval);
    toastContainer.innerHTML = '';
  }
</script>
</body>
</html>
