<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm Delete — Mockup</title>
  <style>
    :root {
      --color-primary: #2563EB;
      --color-danger: #EF4444;
      --color-danger-hover: #DC2626;
      --color-surface: #F1F5F9;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text-primary: #0F172A;
      --color-text-secondary: #64748B;
      --font-family: Inter, system-ui, -apple-system, sans-serif;
      --radius-md: 6px;
      --radius-sm: 4px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: rgba(15, 23, 42, 0.5);
      color: var(--color-text-primary);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .state-bar {
      background: #1E293B;
      color: white;
      padding: 6px 16px;
      font-size: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
    }
    .state-bar button {
      background: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .state-bar button:hover { background: #475569; }

    .modal {
      background: var(--color-surface-elevated);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .modal-body {
      padding: 24px;
      text-align: center;
    }

    .modal-icon { font-size: 36px; margin-bottom: 12px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .modal-issue { font-style: italic; color: var(--color-text-secondary); margin-bottom: 12px; font-size: 14px; }
    .modal-warning { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; margin-bottom: 8px; }

    .error-banner {
      background: #FEF2F2;
      border: 1px solid #FEE2E2;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 13px;
      color: #991B1B;
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      text-align: left;
    }
    body[data-state="api-error"] .error-banner { display: flex; }

    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 0 24px 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      min-width: 80px;
      justify-content: center;
    }
    .btn-secondary { background: var(--color-surface-elevated); color: var(--color-text-primary); border-color: var(--color-border); }
    .btn-secondary:hover { background: var(--color-surface); }
    .btn-danger { background: var(--color-danger); color: white; }
    .btn-danger:hover { background: var(--color-danger-hover); }
    .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    body[data-state="submitting"] .btn-danger .label { display: none; }
    body[data-state="submitting"] .btn-danger .spinner { display: inline-block; }
    body[data-state="submitting"] .btn-danger:disabled { opacity: 1; }
    body:not([data-state="submitting"]) .btn-danger .spinner { display: none; }
    body[data-state="submitting"] .btn-secondary { pointer-events: none; opacity: 0.5; }
  </style>
</head>
<body data-state="populated">

  <div class="state-bar">
    <span>State:</span>
    <button onclick="setState('populated')">Default</button>
    <button onclick="setState('submitting')">Submitting</button>
    <button onclick="setState('api-error')">API Error</button>
  </div>

  <div class="modal" role="alertdialog" aria-describedby="delete-warning">
    <div class="modal-body">
      <div class="modal-icon">&#x26A0;&#xFE0F;</div>
      <h2 class="modal-title">Delete issue?</h2>
      <div class="modal-issue" id="issueTitle">"Fix login redirect"</div>
      <div class="modal-warning" id="delete-warning">This action cannot be undone. All data will be permanently removed.</div>
      <div class="error-banner">
        <span>&#x26A0;&#xFE0F;</span>
        <span>Could not delete issue. Please try again.</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="cancel()">Cancel</button>
      <button class="btn btn-danger" id="deleteBtn" disabled>
        <span class="spinner"></span>
        <span class="label">Delete</span>
      </button>
    </div>
  </div>

  <script>
    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        title: params.get('title') || 'Fix login redirect',
        id: params.get('id') || 'ENG-123'
      };
    }

    function setState(state) {
      document.body.dataset.state = state;
      const deleteBtn = document.getElementById('deleteBtn');
      deleteBtn.disabled = (state === 'submitting');
    }

    function cancel() {
      window.close();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = getParams();
      document.getElementById('issueTitle').textContent = '"' + params.title + '"';
      document.getElementById('deleteBtn').disabled = false;
    });
  </script>
</body>
</html>
