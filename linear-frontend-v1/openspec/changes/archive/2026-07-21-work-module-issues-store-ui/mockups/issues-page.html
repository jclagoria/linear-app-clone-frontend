<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Page — Mockup</title>
  <style>
    :root {
      --color-primary: #2563EB;
      --color-primary-hover: #1D4ED8;
      --color-danger: #EF4444;
      --color-success: #22C55E;
      --color-warning: #F59E0B;
      --color-surface: #F1F5F9;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text-primary: #0F172A;
      --color-text-secondary: #64748B;
      --color-todo: #94A3B8;
      --color-in-progress: #3B82F6;
      --color-done: #22C55E;
      --color-priority-urgent: #EF4444;
      --color-priority-high: #F97316;
      --color-priority-medium: #EAB308;
      --color-priority-low: #94A3B8;
      --font-family: Inter, system-ui, -apple-system, sans-serif;
      --radius-md: 6px;
      --radius-sm: 4px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-surface); color: var(--color-text-primary); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }

    /* App Shell */
    .app-header {
      background: var(--color-surface-elevated);
      border-bottom: 1px solid var(--color-border);
      padding: 0 16px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .app-header .logo { font-weight: 700; font-size: 14px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--color-surface); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: default; border: 1px solid var(--color-border); }
    .avatar-sm { width: 24px; height: 24px; border-radius: 50%; background: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }

    .app-layout { display: flex; flex: 1; }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background: var(--color-surface-elevated);
      border-right: 1px solid var(--color-border);
      padding: 12px 0;
      flex-shrink: 0;
    }
    .nav-item {
      padding: 6px 16px;
      font-size: 13px;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }
    .nav-item.active { color: var(--color-text-primary); background: var(--color-surface); font-weight: 600; border-right: 2px solid var(--color-primary); }
    .nav-count { margin-left: auto; background: var(--color-surface); padding: 0 6px; border-radius: 10px; font-size: 11px; color: var(--color-text-secondary); }
    .nav-section { padding: 8px 16px 4px; font-size: 10px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

    /* Main Content */
    .main-content { flex: 1; padding: 16px 24px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .page-header h1 { font-size: 24px; font-weight: 700; line-height: 1.3; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-secondary { background: var(--color-surface-elevated); color: var(--color-text-primary); border-color: var(--color-border); }
    .btn-ghost { background: transparent; color: var(--color-text-secondary); border-color: transparent; }
    .btn-ghost:hover { background: var(--color-surface); }
    .btn-sm { padding: 4px 8px; font-size: 12px; }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .select-trigger {
      padding: 4px 24px 4px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-elevated);
      font-size: 12px;
      color: var(--color-text-primary);
      cursor: default;
      position: relative;
      font-family: inherit;
      min-width: 100px;
    }
    .select-trigger::after { content: '▼'; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 8px; color: var(--color-text-secondary); }
    .select-trigger.active { border-color: var(--color-primary); }
    .clear-filters { font-size: 12px; color: var(--color-primary); cursor: pointer; }
    .clear-filters.hidden { visibility: hidden; }

    /* Issue List */
    .issue-list { display: flex; flex-direction: column; gap: 4px; }

    /* Issue Card */
    .issue-card {
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      cursor: pointer;
      transition: background 0.1s;
    }
    .issue-card:hover { background: #F8FAFC; }
    .issue-card .checkbox { color: var(--color-text-secondary); font-size: 14px; margin-top: 1px; cursor: default; }
    .issue-card .card-body { flex: 1; min-width: 0; }
    .issue-card .card-id { font-size: 12px; font-weight: 500; line-height: 1.4; font-family: 'SF Mono', 'Fira Code', monospace; color: var(--color-text-secondary); }
    .issue-card .card-title { font-size: 14px; line-height: 1.4; color: var(--color-text-primary); margin-top: 2px; }
    .issue-card .card-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge-todo { background: #F1F5F9; color: #475569; }
    .badge-in-progress { background: #DBEAFE; color: #1D4ED8; }
    .badge-done { background: #DCFCE7; color: #166534; }
    .badge-urgent { background: #FEE2E2; color: #991B1B; }
    .badge-high { background: #FFEDD5; color: #9A3412; }
    .badge-medium { background: #FEF9C3; color: #854D0E; }
    .badge-low { background: #F1F5F9; color: #475569; }

    .avatar-inline { width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; margin-left: auto; flex-shrink: 0; }
    .avatar-inline.jc { background: #8B5CF6; }
    .avatar-inline.al { background: #F59E0B; }
    .avatar-inline.sm { background: #10B981; }
    .avatar-inline.rj { background: #EF4444; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 16px; }

    /* Loading / Skeleton */
    .skeleton-bar {
      height: 12px;
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .skeleton-card {
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 4px;
    }
    .skeleton-card .s-line { height: 12px; margin-bottom: 6px; }
    .skeleton-card .s-line.short { width: 60%; }
    .skeleton-card .s-line.small { width: 40%; height: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Error Banner */
    .error-banner {
      background: #FEF2F2;
      border: 1px solid #FEE2E2;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 13px;
      color: #991B1B;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .error-banner .btn { margin-left: auto; }

    /* State toggles */
    .state-bar {
      background: #1E293B;
      color: white;
      padding: 6px 16px;
      font-size: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .state-bar button {
      background: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .state-bar button:hover { background: #475569; }

    .content-area { flex: 1; }

    /* State visibility */
    body[data-state="populated"] .show-empty,
    body[data-state="populated"] .show-loading,
    body[data-state="populated"] .show-error,
    body[data-state="empty"] .show-populated,
    body[data-state="empty"] .show-loading,
    body[data-state="empty"] .show-error,
    body[data-state="loading"] .show-populated,
    body[data-state="loading"] .show-empty,
    body[data-state="loading"] .show-error,
    body[data-state="error"] .show-populated,
    body[data-state="error"] .show-empty,
    body[data-state="error"] .show-loading {
      display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { padding: 12px; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-bar .select-trigger { width: 100%; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .sidebar { width: 56px; }
      .sidebar .nav-item span:not(.nav-icon) { display: none; }
      .sidebar .nav-count { display: none; }
      .sidebar .nav-section { display: none; }
      .filter-bar { flex-wrap: wrap; }
    }
  </style>
</head>
<body data-state="populated">

  <div class="state-bar">
    <span>State:</span>
    <button onclick="setState('populated')">Populated</button>
    <button onclick="setState('empty')">Empty (first-run)</button>
    <button onclick="setState('empty-filtered')">Empty (filtered)</button>
    <button onclick="setState('loading')">Loading</button>
    <button onclick="setState('error')">Error</button>
  </div>

  <div class="app-header">
    <div class="logo">Linear Clone</div>
    <div class="header-right">
      <div class="header-icon" aria-label="Search">&#x1F50D;</div>
      <div class="header-icon" aria-label="Notifications">&#x1F514;</div>
      <div class="avatar-sm">JD</div>
    </div>
  </div>

  <div class="app-layout">
    <div class="sidebar">
      <div class="nav-section">Main</div>
      <div class="nav-item active">
        <span class="nav-icon">◈</span>
        <span>Issues</span>
        <span class="nav-count">12</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">▣</span>
        <span>Projects</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">◉</span>
        <span>Cycles</span>
      </div>
    </div>

    <div class="main-content">
      <!-- Page Header -->
      <div class="page-header">
        <h1>Issues</h1>
        <button class="btn btn-primary" onclick="openIssueForm('create')">+ New Issue</button>
      </div>

      <!-- Populated state -->
      <div class="show-populated">
        <div class="filter-bar">
          <span class="select-trigger" data-filter="status">Status</span>
          <span class="select-trigger" data-filter="assignee">Assignee</span>
          <span class="select-trigger" data-filter="project">Project</span>
          <span class="select-trigger clear-filters hidden" id="clearFilters" onclick="clearFilters()">✕ Clear</span>
        </div>

        <div class="issue-list" id="issueList"></div>
      </div>

      <!-- Loading state -->
      <div class="show-loading">
        <div class="skeleton-bar" style="width: 80px; height: 28px; margin-bottom: 16px;"></div>
        <div class="skeleton-bar" style="width: 100%; height: 20px;"></div>
        <div class="skeleton-card">
          <div class="skeleton-bar s-line short"></div>
          <div class="skeleton-bar s-line"></div>
          <div class="skeleton-bar s-line small"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-bar s-line short"></div>
          <div class="skeleton-bar s-line"></div>
          <div class="skeleton-bar s-line small"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-bar s-line short"></div>
          <div class="skeleton-bar s-line"></div>
          <div class="skeleton-bar s-line small"></div>
        </div>
      </div>

      <!-- Empty state (first-run) -->
      <div class="empty-state show-empty" id="emptyFirstRun">
        <div class="icon">&#x1F4CB;</div>
        <h2>No issues yet</h2>
        <p>Create the first issue to get started.</p>
        <button class="btn btn-primary" onclick="openIssueForm('create')">Create Issue</button>
      </div>

      <!-- Empty state (filtered) -->
      <div class="empty-state show-empty" id="emptyFiltered" style="display:none;">
        <div class="icon">&#x1F50D;</div>
        <h2>No issues match your filters</h2>
        <p>Try adjusting or clearing your filters.</p>
        <button class="btn btn-secondary" onclick="clearFilters()">Clear Filters</button>
      </div>

      <!-- Error Banner -->
      <div class="show-error">
        <div class="error-banner">
          <span>&#x26A0;&#xFE0F;</span>
          <span>Could not load issues.</span>
          <button class="btn btn-ghost btn-sm" onclick="setState('populated')">Retry</button>
        </div>
        <div class="issue-list" id="issueListCached"></div>
      </div>
    </div>
  </div>

  <script>
    const mockIssues = [
      { id: 'ENG-123', title: 'Fix login redirect', status: 'Todo', priority: 'Urgent', assignee: 'JC', assigneeClass: 'jc' },
      { id: 'ENG-122', title: 'Add dark mode toggle', status: 'In Progress', priority: 'High', assignee: 'AL', assigneeClass: 'al' },
      { id: 'ENG-121', title: 'Update README documentation', status: 'Done', priority: 'Low', assignee: 'SM', assigneeClass: 'sm' },
      { id: 'ENG-120', title: 'Refactor API client error handling', status: 'In Progress', priority: 'Medium', assignee: 'RJ', assigneeClass: 'rj' },
      { id: 'ENG-119', title: 'Implement user avatar upload', status: 'Todo', priority: 'Medium', assignee: 'JC', assigneeClass: 'jc' },
      { id: 'ENG-118', title: 'Add keyboard shortcuts help dialog', status: 'Todo', priority: 'Low', assignee: null },
      { id: 'ENG-117', title: 'Optimize bundle size with code splitting', status: 'Done', priority: 'High', assignee: 'AL', assigneeClass: 'al' },
      { id: 'ENG-116', title: 'Fix notification badge count', status: 'Todo', priority: 'Urgent', assignee: 'SM', assigneeClass: 'sm' },
      { id: 'ENG-115', title: 'Add pagination to issue list', status: 'In Progress', priority: 'Medium', assignee: 'JC', assigneeClass: 'jc' },
      { id: 'ENG-114', title: 'Create issue detail page layout', status: 'Done', priority: 'Medium', assignee: 'RJ', assigneeClass: 'rj' },
      { id: 'ENG-113', title: 'Implement filter persistence', status: 'Todo', priority: 'Low', assignee: null },
      { id: 'ENG-112', title: 'Add project selector to issue form', status: 'In Progress', priority: 'High', assignee: 'AL', assigneeClass: 'al' },
    ];

    const statusColors = {
      'Todo': 'badge-todo',
      'In Progress': 'badge-in-progress',
      'Done': 'badge-done'
    };
    const priorityColors = {
      'Urgent': 'badge-urgent',
      'High': 'badge-high',
      'Medium': 'badge-medium',
      'Low': 'badge-low'
    };

    function renderIssueList(issues, containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = issues.map(issue => `
        <div class="issue-card" onclick="openDetail('${issue.id}')" role="button" tabindex="0">
          <span class="checkbox">&#x25CB;</span>
          <div class="card-body">
            <div class="card-id">${issue.id}</div>
            <div class="card-title">${issue.title}</div>
            <div class="card-meta">
              <span class="badge ${statusColors[issue.status]}">${issue.status}</span>
              <span class="badge ${priorityColors[issue.priority]}">${issue.priority}</span>
            </div>
          </div>
          ${issue.assignee ? `<div class="avatar-inline ${issue.assigneeClass || ''}">${issue.assignee}</div>` : ''}
        </div>
      `).join('');
    }

    function setState(state) {
      document.body.dataset.state = state;
      if (state === 'populated') {
        renderIssueList(mockIssues, 'issueList');
        renderIssueList(mockIssues, 'issueListCached');
        document.getElementById('clearFilters').classList.add('hidden');
      }
      if (state === 'empty') {
        document.getElementById('emptyFirstRun').style.display = '';
        document.getElementById('emptyFiltered').style.display = 'none';
      }
      if (state === 'empty-filtered') {
        document.getElementById('emptyFirstRun').style.display = 'none';
        document.getElementById('emptyFiltered').style.display = '';
      }
      if (state === 'loading') {
        // loading shown via CSS visibility
      }
      if (state === 'error') {
        renderIssueList(mockIssues.slice(0, 3), 'issueListCached');
      }
    }

    function clearFilters() {
      document.querySelectorAll('.select-trigger[data-filter]').forEach(el => el.classList.remove('active'));
      document.getElementById('clearFilters').classList.add('hidden');
    }

    function openIssueForm(mode) {
      window.open('issue-form-modal.html?mode=' + mode, '_blank');
    }

    function openDetail(id) {
      window.open('issue-detail.html?id=' + id, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderIssueList(mockIssues, 'issueList');
      renderIssueList(mockIssues, 'issueListCached');

      document.querySelectorAll('.select-trigger[data-filter]').forEach(el => {
        el.addEventListener('click', function() {
          this.classList.toggle('active');
          const hasActive = document.querySelectorAll('.select-trigger[data-filter].active').length > 0;
          document.getElementById('clearFilters').classList.toggle('hidden', !hasActive);
        });
      });
    });
  </script>
</body>
</html>
