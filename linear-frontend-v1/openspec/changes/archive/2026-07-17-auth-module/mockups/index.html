<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Module — Mockup Index</title>
  <style>
    :root {
      --color-primary: #2563EB;
      --color-surface: #F8FAFC;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text-primary: #0F172A;
      --color-text-secondary: #64748B;
      --font-family: Inter, system-ui, -apple-system, sans-serif;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --radius-md: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-surface); color: var(--color-text-primary); padding: var(--space-6); }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: var(--space-4); }
    p { color: var(--color-text-secondary); margin-bottom: var(--space-6); font-size: 14px; line-height: 1.5; }
    ul { list-style: none; display: flex; flex-direction: column; gap: var(--space-4); }
    a { display: block; padding: var(--space-4); background: var(--color-surface-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-primary); text-decoration: none; font-size: 14px; font-weight: 500; }
    a:hover { border-color: var(--color-primary); }
  </style>
</head>
<body>
  <h1>Auth Module — Mockups</h1>
  <p>Interactive HTML mockups for the authentication flow. Click a screen to open it. Use state toggle buttons in each screen to cycle through states.</p>
  <ul>
    <li><a href="auth-login.html">Login Screen</a></li>
    <li><a href="splash-loading-screen.html">Splash / Loading Screen</a></li>
  </ul>
</body>
</html>
