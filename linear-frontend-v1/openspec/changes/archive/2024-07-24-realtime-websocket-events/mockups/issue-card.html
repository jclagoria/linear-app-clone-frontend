<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue Card — Mockup</title>
  <style>
    :root {
      --color-primary: #5E6AD2;
      --color-surface: #F7F8FC;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E6E8EC;
      --color-text-primary: #1A1D26;
      --color-text-secondary: #6B7280;
      --color-success: #2DA44E;
      --color-warning: #E3B341;
      --color-danger: #CF222E;
      --color-muted: #9CA3AF;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --radius-md: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-surface); color: var(--color-text-primary); }

    .controls { padding: var(--space-4) var(--space-6); display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .controls button { padding: 6px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-elevated); cursor: pointer; font-size: 12px; }
    .controls button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .page-content { padding: 0 var(--space-6) var(--space-6); color: var(--color-text-secondary); font-size: 14px; }

    .card-showcase { max-width: 500px; margin: 0 auto; padding: var(--space-6); }

    .issue-card { display: flex; align-items: center; padding: var(--space-3) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-elevated); cursor: pointer; gap: var(--space-3); transition: box-shadow 0.15s; }
    .issue-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; transition: all 0.3s; }
    .status-todo { border: 2px solid var(--color-muted); }
    .status-progress { border: 2px solid var(--color-warning); background: var(--color-warning); }
    .status-done { background: var(--color-primary); }
    .issue-info { flex: 1; min-width: 0; }
    .issue-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .issue-meta { display: flex; gap: var(--space-2); margin-top: 4px; font-size: 12px; color: var(--color-text-secondary); align-items: center; }
    .label { padding: 1px 6px; border-radius: 4px; font-size: 11px; }
    .label-bug { background: #FEE2E2; color: #B91C1C; }
    .label-feat { background: #DBEAFE; color: #1D4ED8; }
    .issue-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }

    .pulse { animation: pulseAnim 0.6s ease-in-out; }
    @keyframes pulseAnim { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    .flash-green { animation: flashGreen 0.8s ease-out; }
    @keyframes flashGreen { 0% { box-shadow: 0 0 0 3px rgba(45,164,78,0.4); } 100% { box-shadow: none; } }
    .flash-red { animation: flashRed 0.8s ease-out; }
    @keyframes flashRed { 0% { box-shadow: 0 0 0 3px rgba(207,34,46,0.4); } 100% { box-shadow: none; } }
  </style>
</head>
<body>
  <div class="controls">
    <span style="font-size:12px;color:var(--color-text-secondary);margin-right:8px;">Card State:</span>
    <button class="active" onclick="setState('idle')">Idle</button>
    <button onclick="setState('optimistic')">Optimistic</button>
    <button onclick="setState('confirmed')">Confirmed</button>
    <button onclick="setState('reverted')">Reverted</button>
    <button onclick="setState('cycling')">Status Cycling</button>
  </div>

  <div class="page-content">
    <p>IssueCard shows issue summary. Use buttons to preview optimistic update states and animations.</p>
  </div>

  <div class="card-showcase">
    <div id="card" class="issue-card" role="article" aria-label="Issue: Fix login timeout issue, Status: Todo, Priority: Urgent">
      <div id="statusDot" class="status-dot status-todo"></div>
      <div class="issue-info">
        <div class="issue-title">Fix login timeout issue</div>
        <div class="issue-meta">
          <span class="label label-bug">Bug</span>
          <span>🔴 Urgent</span>
          <span>💬3</span>
          <span>📎1</span>
        </div>
      </div>
      <div class="issue-avatar">S</div>
    </div>
  </div>

  <script>
    let currentStatus = 'todo';

    function setState(state) {
      const card = document.getElementById('card');
      const dot = document.getElementById('statusDot');
      card.className = 'issue-card';
      dot.className = 'status-dot';

      document.querySelectorAll('.controls button').forEach((b, i) => {
        if (i < 5) b.classList.toggle('active', b.textContent.toLowerCase() === state);
      });

      if (state === 'idle') {
        dot.classList.add('status-todo');
        currentStatus = 'todo';
      } else if (state === 'optimistic') {
        dot.classList.add('status-progress');
        dot.classList.add('pulse');
        currentStatus = 'progress';
        card.setAttribute('aria-busy', 'true');
      } else if (state === 'confirmed') {
        dot.classList.add('status-progress');
        card.classList.add('flash-green');
        card.setAttribute('aria-busy', 'false');
      } else if (state === 'reverted') {
        dot.classList.add('status-todo');
        card.classList.add('flash-red');
        card.setAttribute('aria-busy', 'false');
      } else if (state === 'cycling') {
        dot.classList.add('status-progress');
        dot.style.animation = 'pulse 0.8s ease-in-out 3';
        setTimeout(() => { dot.style.animation = ''; }, 2400);
      }
    }
  </script>
</body>
</html>
