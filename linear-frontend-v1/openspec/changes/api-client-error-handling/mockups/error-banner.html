<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ErrorBanner — Mockup</title>
  <style>
    :root {
      --color-primary: #2563EB;
      --color-surface: #F8FAFC;
      --color-surface-elevated: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text-primary: #0F172A;
      --color-text-secondary: #64748B;
      --color-error-bg: #FEF2F2;
      --color-error-border: #FECACA;
      --color-error-text: #991B1B;
      --font-family: Inter, system-ui, -apple-system, sans-serif;
      --radius-md: 6px;
      --radius-lg: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--color-surface);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      background: var(--color-surface-elevated);
      border-bottom: 1px solid var(--color-border);
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-header a { color: var(--color-text-secondary); text-decoration: none; font-size: 13px; font-weight: 400; }
    .app-header a:hover { color: var(--color-primary); }

    .app-content {
      flex: 1;
      padding: 40px 24px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .controls button {
      font-family: var(--font-family);
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface-elevated);
      color: var(--color-text-primary);
      cursor: pointer;
    }
    .controls button:hover { background: #F1F5F9; }
    .controls button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    .state-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #E2E8F0;
      margin-bottom: 12px;
    }
    .state-label.active { background: #DBEAFE; color: #1D4ED8; }
    .state-label.error-state { background: #FEF2F2; color: #991B1B; }

    /* ErrorBanner */
    .error-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      background: var(--color-error-bg);
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }
    .error-banner.hidden { display: none; }

    .error-banner-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }
    .error-banner-icon svg {
      width: 18px;
      height: 18px;
      color: var(--color-error-text);
    }

    .error-banner-message {
      font-size: 14px;
      color: var(--color-error-text);
      line-height: 1.5;
    }

    /* Form demo */
    .form-card {
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .form-card h2 { font-size: 15px; margin-bottom: 20px; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--color-text-primary);
    }
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      font-family: var(--font-family);
      font-size: 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface-elevated);
      color: var(--color-text-primary);
    }
    .form-group input:focus { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .form-group .field-error {
      font-size: 12px;
      color: var(--color-error-text);
      margin-top: 4px;
    }
    .form-group.invalid input { border-color: var(--color-error-border); background: #FEF2F2; }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .form-actions button {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
    }
    .form-actions .btn-primary { background: var(--color-primary); color: #fff; }
    .form-actions .btn-primary:hover { opacity: 0.9; }
    .form-actions .btn-secondary { background: var(--color-surface-elevated); color: var(--color-text-primary); border: 1px solid var(--color-border); }
    .form-actions .btn-secondary:hover { background: #F1F5F9; }
  </style>
</head>
<body>
  <div class="app-header">
    <a href="index.html">&larr; Back</a>
    <span>ErrorBanner</span>
  </div>

  <div class="app-content">
    <div class="controls">
      <button class="active" data-state="populated" onclick="setState('populated')">Populated</button>
      <button data-state="empty" onclick="setState('empty')">Empty</button>
      <button data-state="error" onclick="setState('error')">Error</button>
    </div>

    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:24px;">
      Inline error banner within a form. Shows API error messages. Empty by default.
    </p>

    <div class="form-card">
      <span class="state-label" id="stateLabel">populated</span>
      <h2>Create Issue</h2>

      <!-- ErrorBanner -->
      <div class="error-banner" id="errorBanner" role="alert" aria-live="polite">
        <div class="error-banner-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div class="error-banner-message" id="errorMessage">
          Invalid input. Please check the highlighted fields.
        </div>
      </div>

      <div class="form-group invalid">
        <label for="title">Title</label>
        <input type="text" id="title" value="" placeholder="Enter issue title" />
        <div class="field-error">Title is required</div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" id="description" value="Fix login bug" placeholder="Enter description" />
      </div>

      <div class="form-actions">
        <button class="btn-primary">Create</button>
        <button class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    function setState(state) {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      document.querySelector(`.controls button[data-state="${state}"]`).classList.add('active');

      const label = document.getElementById('stateLabel');
      const banner = document.getElementById('errorBanner');
      const message = document.getElementById('errorMessage');
      const titleGroup = document.querySelector('.form-group.invalid');
      const titleInput = document.getElementById('title');

      label.className = 'state-label';

      if (state === 'empty') {
        banner.classList.add('hidden');
        label.textContent = 'empty';
        titleGroup.classList.remove('invalid');
        titleInput.style.borderColor = '';
        titleInput.style.background = '';
        const fieldErr = titleGroup.querySelector('.field-error');
        if (fieldErr) fieldErr.style.display = 'none';
      } else if (state === 'populated') {
        banner.classList.remove('hidden');
        message.textContent = 'Invalid input. Please check the highlighted fields.';
        label.textContent = 'populated';
        label.classList.add('active');
        titleGroup.classList.add('invalid');
        const fieldErr = titleGroup.querySelector('.field-error');
        if (fieldErr) fieldErr.style.display = '';
      } else if (state === 'error') {
        banner.classList.remove('hidden');
        message.textContent = 'Something went wrong. Please try again.';
        label.textContent = 'error';
        label.classList.add('error-state');
        titleGroup.classList.add('invalid');
        const fieldErr = titleGroup.querySelector('.field-error');
        if (fieldErr) { fieldErr.textContent = 'Unexpected server error'; fieldErr.style.display = ''; }
      }
    }

    // Init populated
    document.addEventListener('DOMContentLoaded', () => setState('populated'));
  </script>
</body>
</html>
