<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Project — Mockup</title>
  <style>
    :root {
      --color-primary: #2563EB;
      --color-primary-hover: #1D4ED8;
      --color-danger: #DC2626;
      --color-success: #16A34A;
      --color-text: #0F172A;
      --color-text-muted: #64748B;
      --color-text-inverse: #FFFFFF;
      --color-surface: #FFFFFF;
      --color-surface-alt: #F1F5F9;
      --color-border: #E2E8F0;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --radius: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: rgba(0,0,0,.5); color: var(--color-text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-4); }

    .modal { background: var(--color-surface); border-radius: var(--radius-lg, 8px); width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,.2); max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-border); }
    .modal-header h2 { font-size: 18px; font-weight: 600; }
    .close-btn { background: none; border: none; cursor: pointer; padding: 4px; border-radius: 4px; color: var(--color-text-muted); font-size: 20px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: var(--color-surface-alt); color: var(--color-text); }
    .modal-body { padding: var(--space-6); }

    .form-group { margin-bottom: var(--space-4); }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--color-text); }
    .form-group .required::after { content: ' *'; color: var(--color-danger); }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: 14px; background: var(--color-surface); color: var(--color-text); transition: border-color .15s; }
    .form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .form-input.error { border-color: var(--color-danger); }
    .form-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: 14px; background: var(--color-surface); color: var(--color-text); resize: vertical; min-height: 80px; font-family: inherit; }
    .form-textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .field-error { font-size: 13px; color: var(--color-danger); margin-top: 4px; display: none; }
    .char-count { font-size: 12px; color: var(--color-text-muted); text-align: right; margin-top: 2px; }

    .form-actions { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--color-border); }

    .btn { display: inline-flex; align-items: center; gap: var(--space-2); padding: 10px 16px; border-radius: var(--radius); font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: background .15s; min-height: 44px; min-width: 44px; text-decoration: none; }
    .btn-primary { background: var(--color-primary); color: var(--color-text-inverse); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-primary:disabled { opacity: .5; pointer-events: none; }
    .btn-secondary { background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text); }
    .btn-secondary:hover { background: var(--color-surface-alt); }
    .btn .spinner { width: 16px; height: 16px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .server-error { display: none; padding: var(--space-3) var(--space-4); background: #FEF2F2; border: 1px solid #FECACA; border-radius: var(--radius); font-size: 14px; color: var(--color-danger); margin-bottom: var(--space-4); }

    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 1000; }
    .toast { display: flex; align-items: start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius); background: var(--color-surface); box-shadow: 0 4px 12px rgba(0,0,0,.12); font-size: 14px; max-width: 360px; border-left: 4px solid var(--color-success); animation: slideIn .3s ease-out; }
    .toast .close-btn { background: none; border: none; cursor: pointer; padding: 4px; color: var(--color-text-muted); font-size: 16px; min-width: 44px; min-height: 44px; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .state-toolbar { position: fixed; bottom: 0; left: 0; right: 0; background: #1E293B; color: white; padding: var(--space-3) var(--space-6); display: flex; align-items: center; gap: var(--space-3); font-size: 13px; z-index: 999; flex-wrap: wrap; }
    .state-toolbar button { padding: 6px 12px; border-radius: 4px; border: 1px solid #475569; background: transparent; color: white; cursor: pointer; font-size: 12px; }
    .state-toolbar button:hover { background: #334155; }
    .state-toolbar .label { color: #94A3B8; margin-right: auto; }

    @media (max-width: 640px) { .modal { max-width: 100%; } }
  </style>
</head>
<body data-state="idle">
  <div id="success-toast" class="toast-container" style="display:none;">
    <div class="toast"><span style="flex:1;">Project created</span><button class="close-btn" onclick="this.parentElement.parentElement.style.display='none'">×</button></div>
  </div>

  <div class="modal">
    <div class="modal-header">
      <h2>Create Project</h2>
      <a href="../mockups/projects-page.html" class="close-btn" aria-label="Close">×</a>
    </div>
    <div class="modal-body">
      <div id="server-error" class="server-error">A project with this name already exists in the team.</div>

      <div class="form-group">
        <label class="required">Name</label>
        <input id="field-name" class="form-input" type="text" placeholder="My project name" maxlength="255" oninput="clearFieldError('name')" />
        <div id="error-name" class="field-error">Name is required</div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea class="form-textarea" placeholder="Optional description" maxlength="1000" oninput="updateCharCount(this)"></textarea>
        <div class="char-count"><span id="desc-count">0</span>/1000</div>
      </div>

      <div class="form-group">
        <label>Start Date</label>
        <input class="form-input" type="date" />
      </div>

      <div class="form-group">
        <label>Target Date</label>
        <input class="form-input" type="date" />
      </div>

      <div class="form-actions">
        <a href="../mockups/projects-page.html" class="btn btn-secondary">Cancel</a>
        <button id="submit-btn" class="btn btn-primary" onclick="handleSubmit()">Create Project</button>
      </div>
    </div>
  </div>

  <div class="state-toolbar">
    <span class="label">🔧 State:</span>
    <button onclick="setState('idle')">Idle</button>
    <button onclick="setState('submitting')">Submitting</button>
    <button onclick="setState('validation_error')">Validation Error</button>
    <button onclick="setState('server_error')">Server Error</button>
    <button onclick="setState('success')">Success</button>
  </div>

  <script>
    function setState(state) {
      document.body.dataset.state = state;
      document.getElementById('server-error').style.display = 'none';
      document.getElementById('success-toast').style.display = 'none';
      document.querySelectorAll('.field-error').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Create Project';

      switch (state) {
        case 'submitting':
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner"></span> Creating...';
          break;
        case 'validation_error':
          document.getElementById('field-name').classList.add('error');
          document.getElementById('error-name').style.display = 'block';
          break;
        case 'server_error':
          document.getElementById('server-error').style.display = 'block';
          break;
        case 'success':
          document.getElementById('success-toast').style.display = 'block';
          break;
        default:
          break;
      }
    }

    function handleSubmit() {
      setState('submitting');
      setTimeout(() => setState('validation_error'), 1200);
    }

    function clearFieldError(field) {
      const el = document.getElementById('field-' + field);
      if (el) el.classList.remove('error');
      const err = document.getElementById('error-' + field);
      if (err) err.style.display = 'none';
    }

    function updateCharCount(textarea) {
      document.getElementById('desc-count').textContent = textarea.value.length;
    }
  </script>
</body>
</html>
