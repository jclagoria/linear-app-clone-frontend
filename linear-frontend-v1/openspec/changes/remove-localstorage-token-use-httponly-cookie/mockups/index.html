<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockups — No UI Change</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 2rem;
      max-width: 480px;
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.75rem; }
    p { color: #64748B; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No Mockups Needed</h1>
    <p>This change is a backend-facing auth refactor with zero UI impact. No screens are added, modified, or removed.</p>
  </div>
</body>
</html>
